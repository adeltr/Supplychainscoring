id: v_export_zlecaf
famille: valeur
libelle: Potentiel d'export ZLECAf
definition: >
  Taille du marché africain pour ce produit : ce que les autres pays du
  continent importent chaque année.
formule: "somme des importations du produit par les pays africains, hors Algérie"
source: {nom: "BACI (CEPII) HS 2012", url: "https://www.cepii.fr/CEPII/en/bdd_modele/bdd_modele_item.asp?id=37", licence: "Etalab 2.0", millesime: "2022-2024"}
type: donnee
champ: v_export_zlecaf
normalisation: {methode: logminmax}
sens: plus_haut_plus_favorable
poids_defaut: 2
actif_par_defaut: true
limites: >
  Taille de marché brute : ni la distance, ni les coûts de transport, ni les
  concurrents déjà installés, ni les règles d'origine ne sont pris en compte.

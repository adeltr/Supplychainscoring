id: f_marche_eme
famille: faisabilite
libelle: Marché local face à l'échelle efficace
definition: >
  Compare la taille du marché algérien à la taille qu'il faut pour produire à
  un coût compétitif. Un marché plus grand que l'échelle efficace peut absorber
  une usine ; un marché plus petit suppose d'exporter.
formule: "importations algériennes du produit / médiane des exportations annuelles des pays qui l'exportent avec RCA ≥ 1 et au moins 10 M USD"
source: {nom: "BACI (CEPII) HS 2012", url: "https://www.cepii.fr/CEPII/en/bdd_modele/bdd_modele_item.asp?id=37", licence: "Etalab 2.0", millesime: "2022-2024"}
type: donnee
champ: f_marche_eme
normalisation: {methode: logminmax}
sens: plus_haut_plus_favorable
poids_defaut: 3
actif_par_defaut: true
limites: >
  Valeur estimée. Le numérateur ignore la production locale déjà vendue sur le
  marché intérieur. Le dénominateur est une approximation grossière : les
  exportations d'un pays ne sont pas la capacité d'une usine. Une vraie échelle
  minimale efficace vient d'études d'ingénierie par procédé.
